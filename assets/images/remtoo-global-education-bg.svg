      <circle cx="-405" cy="88" r="8"/><circle cx="-357" cy="88" r="8"/><circle cx="-309" cy="88" r="8"/>
      <circle cx="-405" cy="136" r="8"/><circle cx="-357" cy="136" r="8"/><circle cx="-309" cy="136" r="8"/>
